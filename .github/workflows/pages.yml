name: Deploy public gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gallery pages
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ai-videos-2026-09-14/index.html
            ai-videos-2026-09-14/index.md
          sparse-checkout-cone-mode: false

      - name: Build lightweight site
        run: |
          mkdir -p _site
          cp ai-videos-2026-09-14/index.html _site/index.html
          cp ai-videos-2026-09-14/index.md _site/index.md
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
